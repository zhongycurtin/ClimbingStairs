name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log
          cp app/build/outputs/apk/debug/app-debug.apk StairStep-v1.1.0.apk

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-log
          cp build_output.log build_output.txt
          git add build_output.txt
          git commit -m "ci: failure log"
          git push -f origin ci-log

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StairStep-Build-Outputs
          path: |
            StairStep-v1.1.0.apk
            app/build/outputs/apk/debug/app-debug.apk
            build_output.log

      - name: Create or Update GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "StairStep 步步登峰 v1.1.0"
          body: |
            ## 🏃 步步登峰 (StairStep) v1.1.0 APK 安装包
            
            ### ✨ 本次更新
            1. **运动交互全新升级（支持连续连爬多趟）**：
               - 点击“开始爬楼”启动运动后，每爬完一趟只需拍击大圆钮即可完成本趟打卡 (+1)！
               - 计时器不中断，继续为下一趟计时，完美契合晚上连续爬楼的多趟训练场景。
               - 全部爬完后点击“🏁 结束运动并打卡”，自动弹出成就总结。
            2. **数据备份与一键恢复**：
               - 新增 CSV 数据一键恢复功能，换机或重装无缝还原所有爬楼明细与体重记录。
            3. **固化永久签名证书**：
               - 正式配置专属项目签名 Keystore，保障后续各版本覆盖安装升级数据不丢失。
          files: StairStep-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

