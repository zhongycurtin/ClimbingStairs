name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-log
          cp build_output.log build_output.txt
          git add build_output.txt
          git commit -m "ci: failure log"
          git push -f origin ci-log

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StairStep-Build-Outputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build_output.log
