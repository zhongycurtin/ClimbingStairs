name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log

      - name: Report Build Error on Failure
        if: failure()
        run: |
          echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |error:|FAILED|FAILURE|Exception" build_output.log -A 10 -B 2 | head -n 120 >> $GITHUB_STEP_SUMMARY || tail -n 100 build_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ERR_MSG=$(grep -m 1 -E "e: |error:|FAILED" build_output.log || echo "Gradle build failed")
          echo "::error title=Gradle Build Error::$ERR_MSG"

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StairStep-Build-Outputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build_output.log
